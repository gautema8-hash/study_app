spring:
  application:
    name: xuexijiesuo-web-backend
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/xuexijiesuo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8081
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 与 app-backend 使用同一 JWT_SECRET，保证 token 算法一致；web 后台 token 自洽签发与校验
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me}
